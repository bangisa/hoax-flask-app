# HTTP bootstrap. Certbot adds the HTTPS virtual host and redirect.
<VirtualHost *:80>
    ServerName hoaxflaskapp.isacool.my.id
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 130
    LimitRequestBody 1048576
    ProxyPass / http://127.0.0.1:18080/ connectiontimeout=10 timeout=130
    ProxyPassReverse / http://127.0.0.1:18080/
    ErrorLog ${APACHE_LOG_DIR}/hoaxflaskapp-error.log
    CustomLog ${APACHE_LOG_DIR}/hoaxflaskapp-access.log combined
</VirtualHost>
